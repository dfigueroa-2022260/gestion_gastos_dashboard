<div class="card">
  <div class="panel-form">
    <div class="brand-row">
      <span class="logo-badge"></span>
      <div class="brand">Cash Track</div>
    </div>
    <p class="tagline">Crea tu cuenta</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="field">
        <label for="nombre">Nombre</label>
        <input
          id="nombre"
          type="text"
          formControlName="nombre"
          placeholder="Tu nombre"
          autocomplete="name"
          [class.error]="nombre.invalid && nombre.touched"
        />
        <div class="error-msg" *ngIf="nombre.invalid && nombre.touched">
          Ingresa tu nombre (minimo 2 caracteres).
        </div>
      </div>

      <div class="field">
        <label for="email">Correo</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="nombre@correo.com"
          autocomplete="email"
          [class.error]="email.invalid && email.touched"
        />
        <div class="error-msg" *ngIf="email.invalid && email.touched">
          Ingresa un correo valido.
        </div>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="new-password"
          [class.error]="password.invalid && password.touched"
        />
        <div class="error-msg" *ngIf="password.invalid && password.touched">
          Debe tener al menos 6 caracteres.
        </div>
      </div>

      <div class="field">
        <label for="confirmarPassword">Confirmar contraseña</label>
        <input
          id="confirmarPassword"
          type="password"
          formControlName="confirmarPassword"
          placeholder="••••••••"
          autocomplete="new-password"
          [class.error]="confirmarPassword.touched && form.errors?.['passwordsNoCoinciden']"
        />
        <div
          class="error-msg"
          *ngIf="confirmarPassword.touched && form.errors?.['passwordsNoCoinciden']"
        >
          Las contraseñas no coinciden.
        </div>
      </div>

      <div class="error-msg" style="margin-bottom: 12px;" *ngIf="errorServidor()">
        {{ errorServidor() }}
      </div>

      <button type="submit" [disabled]="cargando()">
        <span class="spinner" [class.show]="cargando()"></span>
        <span>{{ cargando() ? 'Creando cuenta...' : 'Crear cuenta' }}</span>
      </button>
    </form>

    <div class="footer-link">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesion</a>
    </div>
  </div>

  <div class="panel-right">
    <div class="panel-right-content">
      <div class="panel-right-mark">Cash Track</div>
      <p class="panel-right-copy">
        Empieza a organizar tus finanzas desde hoy.
      </p>
    </div>
  </div>
</div>
