<div class="panel">
  <div class="panel-header">
    <div>
      <h2>Usuarios registrados</h2>
      <p>Panel visible solo para administradores.</p>
    </div>
    <a routerLink="/gastos" class="volver">&larr; Volver a gastos</a>
  </div>

  <p *ngIf="cargando()">Cargando...</p>
  <p class="error" *ngIf="error()">{{ error() }}</p>

  <table *ngIf="!cargando() && usuarios().length">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Rol</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of usuarios()">
        <td>{{ u.nombre }}</td>
        <td>{{ u.email }}</td>
        <td>
          <span class="badge" [class.admin]="u.rol === 'ADMIN'">{{ u.rol }}</span>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!cargando() && !usuarios().length && !error()">
    Todavia no hay usuarios registrados.
  </p>
</div>
