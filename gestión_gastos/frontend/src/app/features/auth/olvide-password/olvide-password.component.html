<div class="card">
  <div class="panel-form">
    <a routerLink="/login" class="back-link">&larr; Volver a iniciar sesion</a>

    <div class="brand-row">
      <span class="logo-badge"></span>
      <div class="brand">Cash Track</div>
    </div>
    <p class="tagline">Recupera tu contraseña</p>

    <div class="success-msg" *ngIf="enviado()">
      Si el correo esta registrado, te enviamos un enlace para restablecer tu
      contraseña. Revisa tu bandeja de entrada (y spam).
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate *ngIf="!enviado()">
      <div class="field">
        <label for="email">Correo</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="nombre@correo.com"
          autocomplete="email"
          [class.error]="email.invalid && email.touched"
        />
        <div class="error-msg" *ngIf="email.invalid && email.touched">
          Ingresa un correo valido.
        </div>
      </div>

      <button type="submit" [disabled]="cargando()">
        <span class="spinner" [class.show]="cargando()"></span>
        <span>{{ cargando() ? 'Enviando...' : 'Enviar enlace de recuperacion' }}</span>
      </button>
    </form>

    <div class="footer-link">
      ¿No tienes cuenta? <a routerLink="/registro">Registrate</a>
    </div>
  </div>

  <div class="panel-right">
    <div class="panel-right-content">
      <div class="panel-right-mark">Cash Track</div>
      <p class="panel-right-copy">
        Te ayudamos a recuperar el acceso a tu cuenta.
      </p>
    </div>
  </div>
</div>
